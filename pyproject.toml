[project]
name = "handheld"
version = "0.1.0"
description = "Control a cloud browser from your phone"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "modal>=1.6",
]

[dependency-groups]
dev = ["pytest>=9", "httpx>=0.28", "itsdangerous>=2.2", "fastapi[standard]>=0.160"]

[tool.pytest.ini_options]
testpaths = ["modal-deployment"]
pythonpath = ["modal-deployment"]
